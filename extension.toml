# GitHub on Pointman's machines (James, Pointman thread 649 [4443], [4500], [4505]): GitHub's CLI on each
# node, accounts for agents' runs, and the apps' GitHub viewer. The machine half of GitHub: Pointman's GitHub
# App stays in core ([4670]–[4673]), and core's catalogue lets this repo alone take the id. The apps ask for
# a link through core's jobs (POST /v1/workspaces/{ws}/jobs {kind: "github.view", params: {url}}) and draw
# the answer; GitHub is asked with the vault's account, else this machine's own `gh` login.
[extension]
id = "github"
name = "GitHub"
version = "0.3.0"
publisher = "aurelio"
summary = "GitHub's CLI on this machine, and what a GitHub link shows in the apps' viewer: diffs, files, PR and issue threads, and a PR's review and merge."
node = ">=0.1,<1"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/github"]
runtime = "binary"

[permissions]
network = true
drives_apps = ["gh"]             # GitHub's CLI: GitHub is asked as the vault's account, else this machine's login
secrets = ["github.*"]           # each account's token, kept in the vault as github.<label>

# agents' runs get the vault's token as GH_TOKEN, so `gh` works for them on every node
[sessions]
clients = ["claude", "codex"]
env = ["GH_TOKEN"]

# an account for every node: Sign in from the apps (GitHub's device flow), or paste a token
[[credentials]]
id = "account"
title = "GitHub account"
help = "Sign in, or paste a token: `gh auth token` on a machine signed in as the account, or a fine-grained token from github.com/settings/tokens."
item = "github.{label}"
value = "(gh[pousr]_[A-Za-z0-9]{36,251}|github_pat_[A-Za-z0-9_]{22,255})"
placeholder = "github_pat_…"
needed = 0                       # a machine signed in with gh already works without one
sign_in = true

[settings]
type = "object"

[settings.properties.cli]
type = "string"
default = ""
description = "GitHub's CLI, when it isn't on the node's PATH or in /opt/homebrew/bin or /usr/local/bin; with none, the extension installs its own"

[[commands]]
kind = "github.add"
title = "Add a GitHub account"
params = { type = "object", properties = { name = { type = "string", description = "What to call it (work): lowercase letters, digits, . _ -" } } }
slash = "add"
form = "account"
summary = "Add a GitHub account for every node: sign in, or paste a token"

[[commands]]
kind = "github.view"
title = "What a GitHub link shows"
params = { type = "object", required = ["url"], properties = { url = { type = "string", description = "A PR, a commit, or a file at a commit (#L10-L20 for lines)" } } }

# what a GitHub link shows, as a pane in the apps (Pointman's docs/dev/panes.md): a PR's conversation and
# files, a commit's files, a file's code and how it changed, an issue's conversation; asked again each minute
[[panes]]
id = "view"
title = "GitHub"
format = "blocks"
opens = ["link", "command"]
