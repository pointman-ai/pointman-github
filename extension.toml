# GitHub on Pointman's machines (James, Pointman thread 649 [4443], [4500], [4505]): GitHub's CLI on each
# node, and agents' runs acting on GitHub as Pointman App (MB-707, thread 8446 [26244], [26267]). The machine half
# of GitHub: the App itself is the board's ([4670]–[4673]), and core's catalogue lets this repo alone take the id.
# GitHub's pages open in the apps' web panel (thread 8446): the viewer, its pane and `github.view` went in 0.6.0.
[extension]
id = "github"
name = "GitHub"
version = "0.10.2"
publisher = "aurelio"
summary = "GitHub's CLI on this machine, and agents' runs acting on GitHub as Pointman App."
node = ">=0.4.4"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/github"]
runtime = "binary"

[permissions]
network = true
drives_apps = ["gh"]             # GitHub's CLI: GitHub is asked as Pointman App, with the board's tokens

# what agents write on GitHub goes out as Pointman App's bot: they're told to write about the change, never about
# their person or how they work (James, Pointman thread 8446 [18054]: no "waits for James's review")
[behavior]
skill = "SKILL.md"

# agents' runs act on GitHub as Pointman App, and only as it (MB-707): `gh` first on their PATH asks this extension
# for the token for the repo's owner, git asks it for GitHub's password (GIT_CONFIG_*, never a prompt), pushes to ssh
# remotes go over https, and commits are the App's bot's. Until the board has the App, `gh` and pushes say so.
[sessions]
clients = ["claude", "codex"]
path = ["app/bin"]                # the runs' `gh` shim, put first on PATH by the node
env = [
  "GIT_TERMINAL_PROMPT",
  "GIT_AUTHOR_NAME", "GIT_AUTHOR_EMAIL", "GIT_COMMITTER_NAME", "GIT_COMMITTER_EMAIL",
  "GIT_CONFIG_COUNT",
  "GIT_CONFIG_KEY_0", "GIT_CONFIG_VALUE_0",
  "GIT_CONFIG_KEY_1", "GIT_CONFIG_VALUE_1", "GIT_CONFIG_KEY_2", "GIT_CONFIG_VALUE_2",
  "GIT_CONFIG_KEY_3", "GIT_CONFIG_VALUE_3", "GIT_CONFIG_KEY_4", "GIT_CONFIG_VALUE_4",
]

[settings]
type = "object"

[settings.properties.cli]
type = "string"
default = ""
description = "GitHub's CLI, when it isn't on the node's PATH or in /opt/homebrew/bin or /usr/local/bin; with none, the extension installs its own"
