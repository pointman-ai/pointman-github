[package]
name = "github"
version = "0.8.2"
edition = "2021"
description = "GitHub on Pointman's nodes: gh on each machine, and GitHub accounts for agents' runs."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-github"
publish = false

[dependencies]
anyhow = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "d338e27a5719139d7cafae4f838c1b699395710b" }
regex = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
