[package]
name = "gitview"
version = "0.1.0"
edition = "2021"
description = "What a GitHub link shows, for Pointman's viewer panel: a PR's or a commit's diff, or a file at a commit."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-gitview"
publish = false

[dependencies]
anyhow = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "edf0df3f234865d8ba97500deaeba4cb4ebebeef" }
regex = "1"
serde_json = "1"

[profile.release]
strip = true
lto = true
