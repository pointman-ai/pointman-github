[package]
name = "github"
version = "0.10.0"
edition = "2021"
description = "GitHub on Pointman's nodes: gh on each machine, and agents' runs acting on GitHub as Pointman App."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-github"
publish = false

[dependencies]
anyhow = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.0" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
