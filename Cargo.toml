[package]
name = "gh"
version = "0.1.0"
edition = "2021"
description = "GitHub on Pointman's nodes: the apps' GitHub viewer, from the machine's gh login."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-gh"
publish = false

[dependencies]
anyhow = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "edf0df3f234865d8ba97500deaeba4cb4ebebeef" }
regex = "1"
serde_json = "1"

[profile.release]
strip = true
lto = true
