[package]
name = "github"
version = "0.9.0"
edition = "2021"
description = "GitHub on Pointman's nodes: gh on each machine, and GitHub accounts for agents' runs."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-github"
publish = false

[dependencies]
anyhow = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "b4b2f874595fac71d220bb920e96c6390678c5a2" }
regex = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
