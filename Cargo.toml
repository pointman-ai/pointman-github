[package]
name = "github"
version = "0.4.2"
edition = "2021"
description = "GitHub on Pointman's nodes: the apps' GitHub viewer, from the machine's gh login."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-github"
publish = false

[dependencies]
anyhow = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "a765a5f46e0c347fb9fa457e6b3aaa8bb3a4ae5f" }
regex = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
