[package]
name = "github"
version = "0.1.0"
edition = "2021"
description = "GitHub on Pointman's nodes: the apps' GitHub viewer, from the machine's gh login."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-github"
publish = false

[dependencies]
anyhow = "1"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "b7a2cfbebdc78a1ca352e7a84e5fc01454fa290e" }
regex = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
