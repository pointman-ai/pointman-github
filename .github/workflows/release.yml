# The extension's release (extension.toml: `runtime = "binary"`, `command = ["bin/<id>"]`; Pointman's
# docs/dev/extensions.md, "Compiled extensions").
#
# Push a tag that's extension.toml's version (`git tag v0.7.0 && git push origin v0.7.0`): each
# platform is built on its own runner and packed as <id>-<version>-<platform>.tar.gz, the files at
# its top (extension.toml, bin/<id>, README.md, LICENSE). A prepare job creates a draft release;
# each build uploads its archive directly there, without Actions artifact storage. Only after
# all builds succeed and the complete asset set is checked does the last job publish the draft.
#
# Linux builds are musl, so static: they run on any distribution, NixOS included, whose loader
# isn't where a glibc build looks for it. Both Macs build on macos-15, the Intel one cross-compiled
# (GitHub retired its macos-13 runners), so that's the one build whose tests don't run.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: ""                 # the cargo binary's name, when it isn't the extension's id

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      id: ${{ steps.metadata.outputs.id }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Its id and version, and the tag's
        id: metadata
        run: python3 scripts/release_assets.py metadata extension.toml "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Create or resume the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > release.json; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > release.json
          fi
          python3 scripts/release_assets.py check-draft extension.toml "$GITHUB_REF_NAME" < release.json

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: blacksmith-6vcpu-macos-15, target: aarch64-apple-darwin, test: true }
          - { platform: macos-x86_64, runner: blacksmith-6vcpu-macos-15, target: x86_64-apple-darwin, test: false }
          - { platform: linux-x86_64, runner: blacksmith-4vcpu-ubuntu-2404, target: x86_64-unknown-linux-musl, test: true }
          - { platform: linux-arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm, target: aarch64-unknown-linux-musl, test: true }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      ID: ${{ needs.prepare.outputs.id }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack ${{ matrix.platform }}
        run: |
          mkdir -p pkg/bin
          cp "target/${{ matrix.target }}/release/${BIN:-$ID}" "pkg/bin/$ID"
          chmod 755 "pkg/bin/$ID"
          cp extension.toml SKILL.md README.md LICENSE pkg/
          tar -czf "$ID-$VERSION-${{ matrix.platform }}.tar.gz" -C pkg extension.toml SKILL.md bin README.md LICENSE
      - name: Attach this build to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > release.json
          python3 scripts/release_assets.py check-draft extension.toml "$GITHUB_REF_NAME" < release.json
          gh release upload "$GITHUB_REF_NAME" "$ID-$VERSION-$PLATFORM.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  release:
    needs: [prepare, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish only the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets > release.json
          python3 scripts/release_assets.py check-assets extension.toml "$GITHUB_REF_NAME" < release.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
